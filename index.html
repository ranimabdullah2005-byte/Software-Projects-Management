<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة المهام - Kanban</title>
</head>
<body>
    <h1>لوحة إدارة المهام (Kanban Board)</h1>
    
    <div class="kanban-board">
        <div class="column">
            <h2>قيد الانتظار (To Do)</h2>
        </div>
        <div class="column">
            <h2>قيد التنفيذ (In Progress)</h2>
        </div>
        <div class="column">
            <h2>مكتملة (Done)</h2>
        </div>
    </div>
</body>
</html>
